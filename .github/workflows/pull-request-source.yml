name: Pull request source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-branch:
    name: Source branch
    runs-on: ubuntu-latest
    steps:
      - name: Only release/next can merge into main
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$SOURCE_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
            echo "::error::Pull requests into main must come from this repository, not $SOURCE_REPOSITORY."
            exit 1
          fi
          if [ "$SOURCE_BRANCH" != "release/next" ]; then
            echo "::error::Pull requests into main must come from release/next, not $SOURCE_BRANCH."
            exit 1
          fi
          echo "Source branch is release/next."
